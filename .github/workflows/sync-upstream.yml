name: Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *"   # 每6小时同步
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/ggrrttyyiii/CatVodSpider.git
          git fetch upstream

      - name: Merge upstream
        run: |
          git checkout main
          git merge upstream/main --no-edit || true

      - name: Protect workflows (关键)
        run: |
          git checkout HEAD -- .github/workflows || true

      - name: Commit
        run: |
          git add .
          git commit -m "sync: upstream update" || echo "no changes"

      - name: Push
        run: |
          git push origin main
